name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quality-assurance:
    name: Build, Test & SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt bandit pytest pytest-html

      - name: Build C++ Firewall
        run: |
          g++ -shared -fPIC -o cpp_core/cpp_firewall/firewall.so cpp_core/cpp_firewall/firewall.cpp

      - name: Run PyTest
        env:
          PYTHONPATH: .
        run: python -m pytest testing/unit/ -v --html=reports/unit_report.html

      - name: Run Bandit SAST
        run: bandit -r . -ll -ii -f html -o reports/bandit_report.html || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Security-and-QA-Reports
          path: reports/

  build-and-push:
    name: DAST, Build & Push Container Image
    runs-on: ubuntu-latest
    needs: [quality-assurance]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Start Containers for DAST
        run: docker compose up -d --build

      - name: Wait for Services
        run: sleep 20

      - name: Wait for Services
        run: sleep 20

      - name: Check Container Status & Logs
        run: |
          docker compose ps
          docker compose logs  

      - name: OWASP ZAP Scan Key Generator
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: 'http://localhost:8501'
          fail_action: false

      - name: OWASP ZAP Scan Gateway
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: 'https://localhost:443'
          fail_action: false

      - name: Stop Containers
        run: docker compose down
name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  quality-assurance:
    name: Build, Test & SAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt bandit pytest pytest-html

      - name: Build C++ Firewall
        run: |
          g++ -shared -fPIC -o cpp_core/cpp_firewall/firewall.so cpp_core/cpp_firewall/firewall.cpp

      - name: Run PyTest
        env:
          PYTHONPATH: .
        run: python -m pytest testing/unit/ -v --html=reports/unit_report.html

      - name: Run Bandit SAST
        run: bandit -r . -ll -ii -f html -o reports/bandit_report.html

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Security-and-QA-Reports
          path: reports/

  build-and-push:
    name: DAST, Build & Push Container Image
    runs-on: ubuntu-latest
    needs: [quality-assurance]
    if: github.ref == 'refs/heads/main'
    permissions:
      issues: write
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Start Containers for DAST
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: docker compose up -d --build

      - name: Wait for Services
        run: sleep 20

      - name: Check Container Status & Logs
        run: |
          docker compose ps
          docker compose logs

      - name: OWASP ZAP Scan Gateway
        uses: zaproxy/action-baseline@v0.11.0
        with:
          target: 'https://localhost:443'
          fail_action: false

      - name: Stop Containers
        run: docker compose down

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'hevsecregistry123.azurecr.io/fastapi_backend:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name hevsecregistry123

      - name: Push Docker Images
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: docker compose push fastapi_backend llm_service

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: hevsecregistry123
          containerAppName: hevsec-gateway
          resourceGroup: hevsec-rg
          imageToDeploy: hevsecregistry123.azurecr.io/fastapi_backend:${{ github.sha }}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hybrid AI System Control</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #fff; margin: 0; padding: 20px; display: flex; }
        .sidebar { width: 300px; background-color: #2d2d2d; padding: 20px; border-radius: 8px; margin-right: 20px; }
        .main-content { flex-grow: 1; position: relative; }
        h1, h2, h3 { color: #f0f2f6; }
        .card { background-color: #2d2d2d; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .metric-container { display: flex; gap: 20px; margin-bottom: 20px; }
        .metric-box { background-color: #3d3d3d; padding: 15px; border-radius: 8px; flex: 1; text-align: center; }
        .metric-value { font-size: 1.5em; font-weight: bold; color: #4CAF50; }
        input[type="text"] { width: 90%; padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #555; background-color: #1e1e1e; color: white; }
        button { width: 100%; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 10px; transition: 0.2s; }
        .btn-primary { background-color: #ff4b4b; color: white; }
        .btn-primary:hover { background-color: #ff3333; }
        .btn-secondary { background-color: #4CAF50; color: white; }
        .btn-secondary:hover { background-color: #45a049; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #444; }
        .log-box { font-family: monospace; color: #aaa; font-size: 0.9em; }
        .health-badge { position: absolute; top: 10px; right: 10px; padding: 8px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9em; background-color: #555; }
        .status-online { background-color: #4CAF50; color: white; }
        .status-offline { background-color: #ff4b4b; color: white; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Talk to the Car</h2>
        <input type="text" id="userInput" placeholder="e.g. 'I want to go fast'">
        <button class="btn-primary" onclick="analyzeIntent()">Analyze Intent</button>

        <hr style="border-color: #444; margin: 20px 0;">

        <h3>HPC Batch Processing</h3>
        <button class="btn-secondary" onclick="runParallelScenarios()">Run Parallel Scenarios</button>
        <div id="statusAlert" style="margin-top: 15px; font-size: 0.9em;"></div>
    </div>

    <div class="main-content">
        <div id="serverHealth" class="health-badge">Checking API...</div>
        <h1>True Semantic AI Control</h1>
        <p>Distributed Neuro-Symbolic Architecture (Native JS Client)</p>

        <div class="metric-container">
            <div class="metric-box">
                <div>AI Detected Mode</div>
                <div id="metricMode" class="metric-value">WAITING...</div>
            </div>
            <div class="metric-box">
                <div>Throttle Sensitivity</div>
                <div id="metricAggr" class="metric-value">N/A</div>
            </div>
        </div>

        <div class="card">
            <strong>AI Reasoning:</strong> <span id="metricReasoning" style="color: #aaa;">Waiting for input...</span>
        </div>
    </div>

    <script>
        const API_URL = "/api/v1";
        const HEALTH_URL = "/health";
        const HEADERS = { "Content-Type": "application/json" };

        async function checkServerHealth() {
            const badge = document.getElementById("serverHealth");
            try {
                const response = await fetch(HEALTH_URL);
                if (response.ok) {
                    badge.innerText = "API ONLINE";
                    badge.className = "health-badge status-online";
                } else throw new Error("Server error");
            } catch (error) {
                badge.innerText = "API OFFLINE";
                badge.className = "health-badge status-offline";
            }
        }
        window.onload = checkServerHealth;

        async function analyzeIntent() {
            const userInput = document.getElementById("userInput").value;
            if (!userInput) return alert("Please type a command first.");

            document.getElementById("metricMode").innerText = "THINKING...";
            document.getElementById("statusAlert").innerHTML = "";

            try {
                const response = await fetch(`${API_URL}/intent`, {
                    method: "POST",
                    headers: HEADERS,
                    body: JSON.stringify({ command: userInput, user_prompt: userInput })
                });
                const data = await response.json();
                
                if (response.ok) {
                    document.getElementById("metricMode").innerText = data.mode || "NORMAL";
                    document.getElementById("metricAggr").innerText = `${Math.round((data.aggressiveness || 0.5) * 100)}%`;
                    document.getElementById("metricReasoning").innerText = data.reasoning || "No reasoning provided.";
                    document.getElementById("statusAlert").innerHTML = `<span style="color: #4CAF50;">Command Approved</span>`;
                } else {
                    document.getElementById("metricMode").innerText = "ERROR";
                    document.getElementById("statusAlert").innerHTML = `<span style="color: #ff4b4b;">API Error: ${data.detail || response.status}</span>`;
                }
            } catch (error) {
                document.getElementById("statusAlert").innerHTML = `<span style="color: #ff4b4b;">Connection Failed. API Offline.</span>`;
            }
        }
    </script>
</body>
</html>
